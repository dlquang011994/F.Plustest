name: Cập nhật dữ liệu Dashboard

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-dashboard-data
  cancel-in-progress: false

jobs:
  build-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn Dashboard
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cài thư viện đọc Excel
        run: pip install openpyxl

      - name: Tải file Excel nguồn
        run: curl --fail --location --retry 3 "$SOURCE_XLSX_URL" --output source.xlsx
        env:
          SOURCE_XLSX_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vTZGLwWIcCqTCAjVW0FyEQCQYvQ1MP3O5HRiFsQ6tZoN3DEDXq9ys59pXtNrTSA8w/pub?output=xlsx

      - name: Tạo dữ liệu gọn cho Dashboard
        run: python scripts/build_dashboard_data.py source.xlsx dashboard-data.json

      - name: Lưu dữ liệu mới khi có thay đổi
        run: |
          if git diff --quiet -- dashboard-data.json; then
            exit 0
          fi
          git config user.name "dashboard-data-bot"
          git config user.email "dashboard-data-bot@users.noreply.github.com"
          git add dashboard-data.json
          git commit -m "Cập nhật dữ liệu Dashboard"
          git push
